<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Последний землянин - Прототип</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; }
        #ui { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: #ff3333; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 16px; 
            text-shadow: 0 0 8px #ff0000; 
            pointer-events: none;
            z-index: 10;
        }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <!-- Игровой интерфейс -->
    <div id="ui">
        О2 (КИСЛОРОД): 8.2% <br>
        <span class="blink">СИСТЕМА: КРИТИЧЕСКАЯ ОШИБКА</span><br>
        ГРАВИТАЦИЯ: ОТКЛЮЧЕНА
    </div>

    <!-- Подключаем 3D-движок Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Создаем сцену и туман
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x1a0000, 0.08);

        // Настройка камеры (наш взгляд от первого лица)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Освещение (красная мигающая сирена и фонарик)
        const ambientLight = new THREE.AmbientLight(0x220000); 
        scene.add(ambientLight);

        const flashLight = new THREE.SpotLight(0xffffff, 1.5, 20, Math.PI / 5, 0.5, 1);
        camera.add(flashLight);
        flashLight.position.set(0, 0, 1);
        flashLight.target.position.set(0, 0, -1);
        camera.add(flashLight.target);
        scene.add(camera);

        const alarmLight = new THREE.PointLight(0xff0000, 2, 10);
        alarmLight.position.set(0, 2, -3);
        scene.add(alarmLight);

        // Создаем летающие обломки и вещи (невесомость)
        const objects = [];
        const boxGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4); // Ящики/обломки
        const tapeGeo = new THREE.TorusGeometry(0.2, 0.08, 8, 20); // Моток скотча
        
        const mat1 = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9 });
        const mat2 = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.5 });

        for(let i = 0; i < 20; i++) {
            const isTape = Math.random() > 0.8;
            const mesh = new THREE.Mesh(isTape ? tapeGeo : boxGeo, isTape ? mat2 : mat1);
            
            // Случайная позиция
            mesh.position.set((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 10 - 3);
            mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            scene.add(mesh);
            
            // Физика вращения и полета
            objects.push({
                mesh: mesh,
                rx: (Math.random() - 0.5) * 0.02,
                ry: (Math.random() - 0.5) * 0.02,
                vx: (Math.random() - 0.5) * 0.01,
                vy: (Math.random() - 0.5) * 0.01,
                vz: (Math.random() - 0.5) * 0.01
            });
        }

        camera.position.z = 0;

        // Управление взглядом (пальцем по экрану)
        let targetRotX = 0;
        let targetRotY = 0;

        const onPointerMove = (event) => {
            let x = event.clientX || (event.touches && event.touches[0].clientX);
            let y = event.clientY || (event.touches && event.touches[0].clientY);
            targetRotY = (x / window.innerWidth) * 2 - 1;
            targetRotX = (y / window.innerHeight) * 2 - 1;
        };

        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('touchmove', onPointerMove);

        // Главный цикл игры (анимация)
        function animate() {
            requestAnimationFrame(animate);

            // Плавный поворот камеры
            camera.rotation.y += (-targetRotY - camera.rotation.y) * 0.05;
            camera.rotation.x += (-targetRotX - camera.rotation.x) * 0.05;

            // Мигание красной сирены
            alarmLight.intensity = Math.abs(Math.sin(Date.now() * 0.002)) * 3;

            // Движение объектов
            objects.forEach(obj => {
                obj.mesh.rotation.x += obj.rx;
                obj.mesh.rotation.y += obj.ry;
                obj.mesh.position.x += obj.vx;
                obj.mesh.position.y += obj.vy;
                obj.mesh.position.z += obj.vz;

                // Отскок от стен кабины
                if(Math.abs(obj.mesh.position.x) > 4) obj.vx *= -1;
                if(Math.abs(obj.mesh.position.y) > 4) obj.vy *= -1;
                if(obj.mesh.position.z > 1 || obj.mesh.position.z < -8) obj.vz *= -1;
            });

            renderer.render(scene, camera);
        }
        animate();

        // Подгоняем размер при повороте телефона
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
